name: Heart Disease MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Linting & Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code Quality & Linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --junitxml=pytest-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml

  train-and-evaluate:
    name: Model Training & Evaluation Benchmark
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ingest & Preprocess Dataset
        run: |
          python -m src.data_loader
          python -m src.preprocessing
          python -m src.eda

      - name: Execute Model Training & MLflow Logging
        run: |
          python -m src.train

      - name: Verify Model Artifact Exists
        run: |
          test -f models/heart_disease_pipeline.joblib || exit 1
          test -f reports/model_comparison.csv || exit 1

      - name: Upload Trained Model and Visualizations Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-artifacts
          path: |
            models/
            reports/figures/
            reports/model_comparison.csv
            reports/model_comparison.md
            mlflow.db

  docker-build-verify:
    name: Docker Build & Serving Smoke Test
    needs: train-and-evaluate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Trained Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-artifacts
          path: .

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Serving Image
        run: |
          docker build -t heart-disease-api:ci .

      - name: Run Container & Perform Endpoint Verification
        run: |
          docker run -d -p 8000:8000 --name heart-api-ci heart-disease-api:ci
          sleep 5
          # Health check
          curl -f http://localhost:8000/health || exit 1
          # Metrics check
          curl -f http://localhost:8000/metrics || exit 1
          # Prediction test
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}' \
            || exit 1
